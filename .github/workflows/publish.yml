name: Auto-publish blog posts

# Runs every day at 08:00 UTC (09:00 Morocco). Also runnable manually.
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write      # allow the action to commit published posts

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish due posts + rebuild blog & sitemap
        run: python publish.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No new posts to publish today."
          else
            git commit -m "Auto-publish scheduled blog post(s) [skip ci]"
            git push
          fi
